plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'eclipse'
    id 'maven-publish'
}

group = 'com.vicky'
version = '2.1.0-legacy-port'
base { archivesName = 'bibliocraft-legacy-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { bibliocraft { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { bibliocraft { source sourceSets.main } } }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.jar {
    finalizedBy 'reobfJar'
    manifest {
        attributes([
            'Specification-Title': 'BiblioCraft Legacy',
            'Specification-Vendor': 'Legacy Port',
            'Specification-Version': '2.1.0',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Legacy Port'
        ])
    }
}
