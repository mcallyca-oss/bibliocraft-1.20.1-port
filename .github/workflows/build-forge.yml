name: Build BiblioCraft Legacy Forge 1.20.1

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build and reobfuscate
        run: gradle --no-daemon clean build reobfJar --stacktrace

      - name: Show produced JARs
        if: always()
        run: find build/libs -maxdepth 1 -type f -name '*.jar' -print 2>/dev/null || true

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bibliocraft-legacy-1.20.1-v2.1
          path: build/libs/*.jar
          if-no-files-found: error
